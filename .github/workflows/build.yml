name: Build and release DSH Remote SSH

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and package (Node 22)
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
      package_version: ${{ steps.version.outputs.version }}
      installer_sha256: ${{ steps.installer_sha.outputs.sha256 }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies without build scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Read package version
        id: version
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          echo "tag=v${package_version}" >> "$GITHUB_OUTPUT"
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"

      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const p=require("./package.json"); const expected="v"+p.version; if (process.env.RELEASE_TAG !== expected) { console.error("Release tag does not match package.json version: expected",expected); process.exit(1) }'

      - name: Build and run tests
        run: pnpm test

      # Detect the exact regression where a release updates package.json but
      # accidentally commits an old, version-stamped lib/client.js.
      - name: Verify committed browser bundle is up to date
        run: |
          if ! git diff --exit-code -- lib/client.js; then
            echo "::error::lib/client.js is stale. Run 'pnpm build' and commit the regenerated browser bundle."
            exit 1
          fi

      - name: Package DSH installer
        shell: bash
        run: |
          mkdir -p artifacts
          pnpm pack --pack-destination artifacts
          package_version="$(node -p 'require("./package.json").version')"
          file="artifacts/dsh-plugin-remote-ssh-${package_version}.tgz"
          test -s "$file"
          tar -tzf "$file" > "$RUNNER_TEMP/plugin-files.txt"
          grep -qx 'package/package.json' "$RUNNER_TEMP/plugin-files.txt"
          grep -qx 'package/dist/index.js' "$RUNNER_TEMP/plugin-files.txt"
          grep -qx 'package/lib/client.js' "$RUNNER_TEMP/plugin-files.txt"
          grep -qx 'package/cordis.patch.yml' "$RUNNER_TEMP/plugin-files.txt"
          grep -q '^package/vendor/ssh2/' "$RUNNER_TEMP/plugin-files.txt"
          echo "Validated DSH installer: $file"

      # High/critical advisory findings block distribution of the test installer.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      # Malware scanning is distinct from Gitleaks, which checks only for secrets.
      # Scan both the exact downloadable tarball and its extracted package files.
      # Missing or stale antivirus signatures must fail closed, not silently skip.
      - name: Malware-scan packaged installer (ClamAV)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam.service 2>/dev/null || true
          sudo freshclam --stdout
          scan_dir="$(mktemp -d)"
          trap 'rm -rf "$scan_dir"' EXIT
          package_file="artifacts/dsh-plugin-remote-ssh-${{ steps.version.outputs.version }}.tgz"
          tar -xzf "$package_file" -C "$scan_dir"
          clamscan --recursive --infected "$scan_dir"
          clamscan --infected "$package_file"
          sha256sum "$package_file"

      - name: Record scanned installer SHA-256
        id: installer_sha
        shell: bash
        run: |
          set -euo pipefail
          file="artifacts/dsh-plugin-remote-ssh-${{ steps.version.outputs.version }}.tgz"
          echo "sha256=$(sha256sum "$file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # GitHub's upload-artifact v7 can publish one file directly without an
      # additional outer ZIP; the artifact name is the file basename.
      - name: Upload verified installer (direct .tgz)
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/dsh-plugin-remote-ssh-${{ steps.version.outputs.version }}.tgz
          archive: false
          if-no-files-found: error
          retention-days: 30

  verify_artifact:
    name: Verify direct installer download (SHA-256)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download the direct .tgz artifact
        uses: actions/download-artifact@v8
        with:
          name: dsh-plugin-remote-ssh-${{ needs.build.outputs.package_version }}.tgz
          path: downloaded
      - name: Verify round-trip integrity and expected package structure
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.installer_sha256 }}
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
        run: |
          set -euo pipefail
          file="downloaded/dsh-plugin-remote-ssh-${PACKAGE_VERSION}.tgz"
          test -s "$file"
          echo "${EXPECTED_SHA256}  ${file}" | sha256sum -c -
          tar -tzf "$file" > "$RUNNER_TEMP/installer-entries.txt"
          grep -qx 'package/package.json' "$RUNNER_TEMP/installer-entries.txt"
          grep -qx 'package/dist/index.js' "$RUNNER_TEMP/installer-entries.txt"
          echo "Direct artifact download matches the scanned installer"

  release:
    name: Publish GitHub Release
    needs: [build, verify_artifact]
    outputs:
      published: ${{ steps.tag_check.outputs.publish }}
      npm_eligible: ${{ steps.tag_check.outputs.npm_eligible }}
    if: >-
      github.event_name == 'push' &&
      github.repository == 'WeipengMO/dsh-plugin-remote-ssh' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check whether the version tag exists
        id: tag_check
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release_tag }}
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
          EXPECTED_DIGEST: sha256:${{ needs.build.outputs.installer_sha256 }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            # Allow an npm-only retry only if the already-released installer
            # is byte-for-byte identical to this freshly scanned artifact.
            # Missing release assets or missing digest must fail closed.
            asset_name="dsh-plugin-remote-ssh-${PACKAGE_VERSION}.tgz"
            asset_digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG"               --jq ".assets[] | select(.name == \"$asset_name\") | .digest" 2>/dev/null || true)"
            if [ "$asset_digest" = "$EXPECTED_DIGEST" ]; then
              echo "npm_eligible=true" >> "$GITHUB_OUTPUT"
              echo "Existing release asset digest matches verified installer; npm retry is eligible."
            else
              echo "npm_eligible=false" >> "$GITHUB_OUTPUT"
              echo "Existing release asset missing or digest mismatch; npm retry is disabled."
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "npm_eligible=true" >> "$GITHUB_OUTPUT"
            echo "Creating a new release for $TAG."
          fi

      - name: Tag the tested main commit
        if: github.ref == 'refs/heads/main' && steps.tag_check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"

      - name: Download tested installer
        if: github.ref != 'refs/heads/main' || steps.tag_check.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: dsh-plugin-remote-ssh-${{ needs.build.outputs.package_version }}.tgz
          path: artifacts

      - name: Publish stable release from the validated version
        if: github.ref != 'refs/heads/main' || steps.tag_check.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: DSH Remote SSH ${{ needs.build.outputs.release_tag }}
          prerelease: false
          body: |
            Official DSH Remote SSH release. This release combines the fixes from PR #24, #29 and #30.

            Highlights:
            - Restrict host-native bash/pwsh tools in remote SSH Agent scopes where supported; use approval-gated remote_bash.
            - Improve SSH approval diagnostics and remote workspace guidance.
            - Speed up recursive glob with up to 8 concurrent read-only SFTP listings and literal-prefix pruning; preserve the 20s safety budget.
            - Distribute the exact SHA-256-verified and ClamAV-scanned .tgz installer directly.

            Install: `dsh plugin --profile desktop add <path-to-downloaded-tgz>`
            Restart the DSH Host after upgrading. Jupyter Notebook Viewer (PR #25) is not included in this release.

            See [CHANGELOG](https://github.com/WeipengMO/dsh-plugin-remote-ssh/blob/${{ needs.build.outputs.release_tag }}/CHANGELOG.md) for details, security boundaries and migration notes.
          generate_release_notes: true
          files: artifacts/*.tgz
          fail_on_unmatched_files: true

  npm_publish:
    name: Publish tested installer to npm (Trusted Publishing)
    needs: [build, release]
    # Opt-in after npm package ownership and OIDC publisher setup.
    # A PR, manual run or tag push can never publish here. An existing tag
    # allows npm-only retry only when its Release asset SHA-256 exactly matches
    # the newly scanned installer; npm immutability remains enforced.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'WeipengMO/dsh-plugin-remote-ssh' &&
      vars.NPM_PUBLISH_ENABLED == 'true' &&
      needs.release.outputs.npm_eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Set up Node.js for npm OIDC
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin npm CLI with trusted-publishing support
        run: npm install --global npm@11.21.0

      - name: Download the same CI-validated installer as GitHub Release
        uses: actions/download-artifact@v8
        with:
          name: dsh-plugin-remote-ssh-${{ needs.build.outputs.package_version }}.tgz
          path: artifacts

      - name: Verify package identity and release version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "v$version"
          file="artifacts/dsh-plugin-remote-ssh-${version}.tgz"
          test -s "$file"
          tar -xOzf "$file" package/package.json > "$RUNNER_TEMP/npm-manifest.json"
          node -e 'const fs=require("node:fs"); const pkg=require("./package.json"); const tar=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (pkg.name !== "dsh-plugin-remote-ssh" || tar.name !== pkg.name || tar.version !== pkg.version || !tar.repository?.url?.includes("github.com/WeipengMO/dsh-plugin-remote-ssh")) { console.error("Validated release tarball metadata does not match repository"); process.exit(1); }' "$RUNNER_TEMP/npm-manifest.json"
          sha256sum "$file"

      - name: Check if npm already has this immutable version
        id: registry
        env:
          REGISTRY_URL: https://registry.npmjs.org
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const url = process.env.REGISTRY_URL + '/' + encodeURIComponent(manifest.name) + '/' + encodeURIComponent(manifest.version);
          const response = await fetch(url, { headers: { accept: 'application/json' } });
          if (response.status !== 200 && response.status !== 404) throw new Error('npm registry lookup failed: HTTP ' + response.status);
          const exists = response.status === 200;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'exists=' + exists + '\n');
          console.log(exists ? 'Package version already on npm; will not republish.' : 'New version available for publishing to npm.');
          NODE

      - name: Publish verified tarball to npm (OIDC, no NPM_TOKEN)
        if: steps.registry.outputs.exists == 'false'
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          file="./artifacts/dsh-plugin-remote-ssh-${version}.tgz"
          log="$RUNNER_TEMP/npm-publish.log"
          if npm publish "$file" --access public --tag latest --ignore-scripts >"$log" 2>&1; then
            cat "$log"
          else
            cat "$log" >&2
            # npm's first publish can remain staged for several minutes while
            # the public metadata endpoint still returns 404. This specific
            # immutable staged-version E409 is not a reason to publish again.
            # Do not conceal any other publication failure.
            if grep -q 'Cannot publish over previously staged version' "$log"; then
              echo "Version is already staged at npm; waiting for verified registry visibility."
            else
              exit 1
            fi
          fi

      - name: Verify npm version and immutable tarball digest are visible
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          file="artifacts/dsh-plugin-remote-ssh-${version}.tgz"
          expected_sha1="$(sha1sum "$file" | cut -d' ' -f1)"
          # Allow npm's staging/processing phase to finish without failing a
          # genuinely successful Trusted Publisher upload at the first 404.
          for attempt in $(seq 1 36); do
            visible="$(npm view "dsh-plugin-remote-ssh@${version}" version --silent 2>/dev/null || true)"
            if [ "$visible" = "$version" ]; then
              actual_sha1="$(npm view "dsh-plugin-remote-ssh@${version}" dist.shasum --silent 2>/dev/null || true)"
              if [ "$actual_sha1" = "$expected_sha1" ]; then
                echo "npm now serves dsh-plugin-remote-ssh@${version} with matching tarball digest"
                exit 0
              fi
              echo "::error::npm version is visible but its immutable tarball digest does not match the CI-verified installer"
              exit 1
            fi
            echo "npm package still processing (attempt ${attempt}/36); retrying registry read"
            sleep 10
          done
          echo "::error::npm did not expose the validated version after the registry visibility retry budget"
          exit 1
