name: Build and release DSH Remote SSH

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and package (Node 22)
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies without build scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Read package version
        id: version
        run: |
          echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const p=require("./package.json"); const expected="v"+p.version; if (process.env.RELEASE_TAG !== expected) { console.error("Release tag does not match package.json version: expected",expected); process.exit(1) }'

      - name: Build and run tests
        run: pnpm test

      # Detect the exact regression where a release updates package.json but
      # accidentally commits an old, version-stamped lib/client.js.
      - name: Verify committed browser bundle is up to date
        run: |
          if ! git diff --exit-code -- lib/client.js; then
            echo "::error::lib/client.js is stale. Run 'pnpm build' and commit the regenerated browser bundle."
            exit 1
          fi

      - name: Package DSH installer
        shell: bash
        run: |
          mkdir -p artifacts
          pnpm pack --pack-destination artifacts
          package_version="$(node -p 'require("./package.json").version')"
          file="artifacts/dsh-plugin-remote-ssh-${package_version}.tgz"
          test -s "$file"
          tar -tzf "$file" > "$RUNNER_TEMP/plugin-files.txt"
          grep -qx 'package/package.json' "$RUNNER_TEMP/plugin-files.txt"
          grep -qx 'package/dist/index.js' "$RUNNER_TEMP/plugin-files.txt"
          grep -qx 'package/lib/client.js' "$RUNNER_TEMP/plugin-files.txt"
          grep -qx 'package/cordis.patch.yml' "$RUNNER_TEMP/plugin-files.txt"
          grep -q '^package/vendor/ssh2/' "$RUNNER_TEMP/plugin-files.txt"
          echo "Validated DSH installer: $file"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-remote-ssh-${{ github.sha }}
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    outputs:
      published: ${{ steps.tag_check.outputs.publish }}
    if: >-
      github.event_name == 'push' &&
      github.repository == 'WeipengMO/dsh-plugin-remote-ssh' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check whether the version tag exists
        id: tag_check
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version $TAG is already tagged; skipping automatic release."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Creating a new release for $TAG."
          fi

      - name: Tag the tested main commit
        if: github.ref == 'refs/heads/main' && steps.tag_check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"

      - name: Download tested installer
        if: github.ref != 'refs/heads/main' || steps.tag_check.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dsh-remote-ssh-${{ github.sha }}
          path: artifacts

      - name: Publish stable release from the validated version
        if: github.ref != 'refs/heads/main' || steps.tag_check.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: DSH Remote SSH ${{ needs.build.outputs.release_tag }}
          prerelease: false
          body: |
            Official DSH Remote SSH release. Install the attached verified .tgz package using:
            `dsh plugin --profile desktop add <path-to-downloaded-tgz>`

            See [CHANGELOG](https://github.com/WeipengMO/dsh-plugin-remote-ssh/blob/${{ needs.build.outputs.release_tag }}/CHANGELOG.md) for this version's features, security behavior, and migration notes.
          generate_release_notes: true
          files: artifacts/*.tgz
          fail_on_unmatched_files: true

  npm_publish:
    name: Publish tested installer to npm (Trusted Publishing)
    needs: [build, release]
    # Opt-in after npm package ownership and OIDC publisher setup.
    # A PR, manual run, tag push or existing already-tagged version can never
    # publish here. Existing GitHub Release behavior remains independent.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'WeipengMO/dsh-plugin-remote-ssh' &&
      vars.NPM_PUBLISH_ENABLED == 'true' &&
      needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Set up Node.js for npm OIDC
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin npm CLI with trusted-publishing support
        run: npm install --global npm@11.21.0

      - name: Download the same CI-validated installer as GitHub Release
        uses: actions/download-artifact@v4
        with:
          name: dsh-remote-ssh-${{ github.sha }}
          path: artifacts

      - name: Verify package identity and release version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "v$version"
          file="artifacts/dsh-plugin-remote-ssh-${version}.tgz"
          test -s "$file"
          tar -xOzf "$file" package/package.json > "$RUNNER_TEMP/npm-manifest.json"
          node -e 'const fs=require("node:fs"); const pkg=require("./package.json"); const tar=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (pkg.name !== "dsh-plugin-remote-ssh" || tar.name !== pkg.name || tar.version !== pkg.version || !tar.repository?.url?.includes("github.com/WeipengMO/dsh-plugin-remote-ssh")) { console.error("Validated release tarball metadata does not match repository"); process.exit(1); }' "$RUNNER_TEMP/npm-manifest.json"
          sha256sum "$file"

      - name: Check if npm already has this immutable version
        id: registry
        env:
          REGISTRY_URL: https://registry.npmjs.org
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const url = process.env.REGISTRY_URL + '/' + encodeURIComponent(manifest.name) + '/' + encodeURIComponent(manifest.version);
          const response = await fetch(url, { headers: { accept: 'application/json' } });
          if (response.status !== 200 && response.status !== 404) throw new Error('npm registry lookup failed: HTTP ' + response.status);
          const exists = response.status === 200;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'exists=' + exists + '\n');
          console.log(exists ? 'Package version already on npm; will not republish.' : 'New version available for publishing to npm.');
          NODE

      - name: Publish verified tarball to npm (OIDC, no NPM_TOKEN)
        if: steps.registry.outputs.exists == 'false'
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          version="$(node -p 'require("./package.json").version')"
          npm publish "artifacts/dsh-plugin-remote-ssh-${version}.tgz" --access public --tag latest --ignore-scripts

      - name: Verify npm version is visible
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          version="$(node -p 'require("./package.json").version')"
          published="$(npm view "dsh-plugin-remote-ssh@${version}" version --silent)"
          test "$published" = "$version"
          echo "npm now serves dsh-plugin-remote-ssh@${version}"
