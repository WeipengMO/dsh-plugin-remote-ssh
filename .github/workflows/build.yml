name: Build and release DSH Remote SSH

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and package (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies without build scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const p=require("./package.json"); const expected="v"+p.version; if (process.env.RELEASE_TAG !== expected) { console.error("Release tag does not match package.json version: expected",expected); process.exit(1) }'

      - name: Build and run tests
        run: pnpm test

      - name: Package DSH installer
        shell: bash
        run: |
          mkdir -p artifacts
          pnpm pack --pack-destination artifacts
          file="$(find artifacts -maxdepth 1 -name 'dsh-plugin-remote-ssh-*.tgz' -type f -print -quit)"
          test -n "$file"
          tar -tzf "$file" > "$RUNNER_TEMP/plugin-files.txt"
          grep -qx 'package/package.json' "$RUNNER_TEMP/plugin-files.txt"
          grep -qx 'package/dist/index.js' "$RUNNER_TEMP/plugin-files.txt"
          grep -qx 'package/dist/dsh-web-tunnel.js' "$RUNNER_TEMP/plugin-files.txt"
          grep -qx 'package/dist/remote-host-runtime.js' "$RUNNER_TEMP/plugin-files.txt"
          grep -qx 'package/runtime/agent.mjs' "$RUNNER_TEMP/plugin-files.txt"
          grep -qx 'package/lib/client.js' "$RUNNER_TEMP/plugin-files.txt"
          grep -qx 'package/cordis.patch.yml' "$RUNNER_TEMP/plugin-files.txt"
          grep -q '^package/vendor/ssh2/' "$RUNNER_TEMP/plugin-files.txt"
          echo "Validated DSH installer: $file"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-remote-ssh-${{ github.sha }}
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 30

  web-launcher:
    name: Linux DSH Web launch smoke (Node 24.9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
      - name: Verify private remote Web launcher and token handoff
        run: node --test test/remote-web-launcher.node24.test.js

  release:
    name: Publish GitHub Release
    needs: [build, web-launcher]
    if: >-
      github.event_name == 'push' &&
      github.repository == 'WeipengMO/dsh-plugin-remote-ssh' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested installer
        uses: actions/download-artifact@v4
        with:
          name: dsh-remote-ssh-${{ github.sha }}
          path: artifacts

      - name: Publish development prerelease from main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.run_number }}-${{ github.run_attempt }}
          name: Development build #${{ github.run_number }} (main)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: artifacts/*.tgz
          fail_on_unmatched_files: true

      - name: Publish stable release from version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DSH Remote SSH ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          files: artifacts/*.tgz
          fail_on_unmatched_files: true
